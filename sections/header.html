<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

    <style>

        /* =========================================================
        THE ASTRALUXE ADVISORY — GLOBAL DESIGN SYSTEM
        Single-file starter: HTML + CSS + JavaScript.
        ========================================================= */
        :root {
        --al-navy: #334155;
        --al-charcoal: #1E293B;
        --al-gold: #D4AF37;
        --al-champagne: #C5A880;
        --al-paper: #F8FAFC;
        --al-white: #FFFFFF;
        --al-ink: #0F172A;
        --al-muted: #64748B;
        --al-line: rgba(51, 65, 85, .16);
        --al-serif: "Cormorant Garamond", Georgia, serif;
        --al-sans: "Montserrat", Arial, sans-serif;
        --al-body: "Lora", Georgia, serif;
        --al-container: 1220px;
        --al-gutter: clamp(20px, 5vw, 72px);
        --al-section-space: clamp(76px, 10vw, 142px);
        --al-radius: 3px;
        --al-shadow: 0 24px 70px rgba(15, 23, 42, .10);
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 96px; }
        body {
        margin: 0;
        background: var(--al-paper);
        color: var(--al-ink);
        font-family: var(--al-body);
        font-size: 16px;
        line-height: 1.75;
        overflow-x: hidden;
        }
        body.al-menu-open { overflow: hidden; }
        img, video { display: block; max-width: 100%; }
        img { width: 100%; height: auto; object-fit: contain; }
        video { width: 100%; height: auto; object-fit: contain; }
        a { color: inherit; text-decoration: none; }
        button, input, textarea, select { font: inherit; }
        button, a { -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; }
        ::selection { background: var(--al-gold); color: var(--al-charcoal); }

        .al-container { width: min(var(--al-container), calc(100% - var(--al-gutter) * 2)); margin-inline: auto; }
        .al-section { padding-block: var(--al-section-space); }
        .al-section--paper { background: var(--al-paper); }
        .al-section--white { background: var(--al-white); }
        .al-section--navy { background: var(--al-charcoal); color: var(--al-white); }
        .al-section--charcoal { background: var(--al-charcoal); color: var(--al-white); }
        .al-overline {
        display: inline-flex; align-items: center; gap: 12px;
        margin: 0 0 18px; color: var(--al-champagne);
        font: 500 10px/1.5 var(--al-sans); letter-spacing: .2em; text-transform: uppercase;
        }
        .al-overline::before { content: ""; display: inline-block; width: 30px; height: 1px; background: currentColor; }
        .al-heading {
        margin: 0; font: 400 clamp(2.6rem, 5.2vw, 5rem)/.98 var(--al-serif);
        letter-spacing: -.025em;
        }
        .al-heading em { color: var(--al-champagne); font-weight: 400; }
        .al-lede { max-width: 720px; margin: 22px 0 0; color: var(--al-muted); font-size: clamp(1rem, 1.25vw, 1.12rem); line-height: 1.9; }
        .al-section--navy .al-lede, .al-section--charcoal .al-lede { color: #D7DEE8; }
        .al-section-head { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: clamp(38px, 5vw, 64px); }
        .al-section-head__copy { max-width: 760px; }
        .al-label { font: 500 10px/1.6 var(--al-sans); text-transform: uppercase; letter-spacing: .17em; }
        .al-button {
        display: inline-flex; justify-content: center; align-items: center; gap: 14px;
        min-height: 52px; padding: 14px 22px; border: 1px solid var(--al-gold);
        background: var(--al-gold); color: var(--al-charcoal);
        font: 600 10px/1.4 var(--al-sans); letter-spacing: .14em; text-transform: uppercase;
        transition: color .25s ease, background .25s ease, border-color .25s ease, transform .25s ease;
        }
        .al-button:hover { background: transparent; color: var(--al-gold); transform: translateY(-2px); }
        .al-button--outline { background: transparent; color: var(--al-white); border-color: rgba(255,255,255,.48); }
        .al-button--outline:hover { border-color: var(--al-gold); background: var(--al-gold); color: var(--al-charcoal); }
        .al-button--dark { background: var(--al-navy); color: var(--al-white); border-color: var(--al-navy); }
        .al-button--dark:hover { background: var(--al-charcoal); color: var(--al-white); border-color: var(--al-charcoal); }
        .al-arrow { display: inline-block; font-size: 17px; line-height: 1; transition: transform .25s ease; }
        a:hover .al-arrow, button:hover .al-arrow { transform: translateX(4px); }
        .al-rule { width: 100%; height: 1px; background: var(--al-line); }
        .al-skip-link { position: absolute; left: 12px; top: -60px; z-index: 1000; background: var(--al-gold); padding: 10px 16px; color: var(--al-charcoal); }
        .al-skip-link:focus { top: 12px; }


        /* =========================================================
        01 — NAVBAR
        ========================================================= */
        .al-header { position: sticky; top: 0; z-index: 100; background: var(--al-ink); color: var(--al-white); border-bottom: 1px solid rgba(255,255,255,.09); backdrop-filter: blur(14px); padding: 0 100px;}
        .al-header__inner { display: flex; align-items: center; justify-content: space-between; gap: 30px; min-height: 88px; }
        .al-brand { display: inline-flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .al-brand__mark { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--al-champagne); color: var(--al-champagne); font: 500 25px/1 var(--al-serif); }
        .al-brand__wordmark { display: flex; flex-direction: column; line-height: 1; }
        .al-brand__name { font: 500 20px/1 var(--al-serif); letter-spacing: .08em; }
        .al-brand__descriptor { margin-top: 7px; color: #D6DCE5; font: 500 8px/1.2 var(--al-sans); letter-spacing: .2em; text-transform: uppercase; }
        .al-nav { display: flex; align-items: center; justify-content: center; gap: clamp(16px, 2.1vw, 31px); }
        .al-nav__link { position: relative; padding-block: 10px; color: #E7EBF0; font: 500 12px/1.4 var(--al-sans); letter-spacing: .11em; text-transform: uppercase; white-space: nowrap; }
        .al-nav__link::after { content: ""; position: absolute; left: 0; right: 100%; bottom: 2px; height: 1px; background: var(--al-gold); transition: right .25s ease; }
        .al-nav__link:hover::after, .al-nav__link:focus-visible::after { right: 0; }
        .al-nav-logo { width: 170px; max-width: 100%; height: auto; }
        .al-header__cta { min-height: 43px; padding: 12px 15px; white-space: nowrap; font-size: 9px; }
        .al-menu-toggle { display: none; width: 44px; height: 44px; padding: 10px; border: 1px solid rgba(255,255,255,.3); background: transparent; color: var(--al-white); }
        .al-menu-toggle span { display: block; width: 20px; height: 1px; margin: 5px auto; background: currentColor; transition: transform .25s ease; }
        
        /* =========================================================
        REGISTRATION DROPDOWN — ASTRALUXE THEME
        ========================================================= */

        .al-nav-dropdown {
        position: relative;
        display: flex;
        align-items: center;
        }

        /* Make the trigger visually consistent with the other nav links. */
        /* .al-nav-dropdown__trigger {
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        background: transparent;
        font: 500 11px/1.4 var(--al-sans);
        color: inherit;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        white-space: nowrap;
        } */

        .al-nav-dropdown__chevron {
        display: inline-block;
        color: #D4AF37;
        font-size: 13px;
        line-height: 1;
        transform: translateY(-2px);
        transition: transform 0.3s ease;
        }

        /* Dropdown panel: hidden until opened. */
        .al-nav-dropdown__menu {
        position: absolute;
        top: calc(100% + 14px);
        left: 50%;
        z-index: 1100;

        width: 270px;
        padding: 8px;

        background: #1E293B;
        border: 1px solid rgba(212, 175, 55, 0.32);
        border-radius: 12px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.24);

        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translate(-50%, 10px) scale(0.98);
        transform-origin: top center;

        transition:
            opacity 0.28s ease,
            transform 0.32s cubic-bezier(0.2, 0.75, 0.25, 1),
            visibility 0.28s ease;
        }

        /* Small gold accent along the top edge. */
        .al-nav-dropdown__menu::before {
        content: "";
        position: absolute;
        top: 0;
        left: 22px;
        right: 22px;
        height: 1px;
        background: linear-gradient(
            90deg,
            transparent,
            #D4AF37,
            transparent
        );
        }

        /* Open state is controlled by JavaScript. */
        .al-nav-dropdown.is-open .al-nav-dropdown__menu {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translate(-50%, 0) scale(1);
        }

        .al-nav-dropdown.is-open .al-nav-dropdown__chevron {
        transform: translateY(2px) rotate(180deg);
        }

        /* Both dropdown options are real anchor links. */
        .al-nav-dropdown__option {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 14px 15px;
        border-radius: 8px;
        text-decoration: none;
        color: #F8FAFC;
        transition:
            background 0.25s ease,
            padding-left 0.25s ease;
        }

        .al-nav-dropdown__option + .al-nav-dropdown__option {
        border-top: 1px solid rgba(248, 250, 252, 0.09);
        }

        .al-nav-dropdown__option:hover,
        .al-nav-dropdown__option:focus-visible {
        background: rgba(212, 175, 55, 0.09);
        padding-left: 20px;
        outline: none;
        }

        .al-nav-dropdown__option-title {
        font-family: "Montserrat", sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.045em;
        text-transform: uppercase;
        color: #F8FAFC;
        }

        .al-nav-dropdown__option-description {
        font-family: "Lora", serif;
        font-size: 12px;
        line-height: 1.5;
        color: #CBD5E1;
        }

        /* Keyboard focus for the Registration trigger. */
        .al-nav-dropdown__trigger:focus-visible {
        outline: 1px solid #D4AF37;
        outline-offset: 5px;
        border-radius: 2px;
        }

        /* Prevent the dropdown from exceeding the viewport on small screens. */
        @media (max-width: 768px) {
        .al-nav-dropdown {
            flex-direction: column;
            align-items: stretch;
        }

        .al-nav-dropdown__trigger {
            justify-content: flex-start;
        }

        .al-nav-dropdown__menu {
            position: static;
            width: 100%;
            margin-top: 8px;
            transform: translateY(8px);
            transform-origin: top center;
        }

        .al-nav-dropdown.is-open .al-nav-dropdown__menu {
            transform: translateY(0);
        }
        }

        @media (prefers-reduced-motion: reduce) {
        .al-nav-dropdown__menu,
        .al-nav-dropdown__chevron,
        .al-nav-dropdown__option {
            transition: none;
        }
        }

        /* =========================================================
        RESPONSIVE BREAKPOINTS
        ========================================================= */
        @media (max-width: 1100px) {
        .al-header { padding: 0 2rem; }
        .al-header__inner { gap: 18px; justify-content: space-between;}
        .al-nav { gap: 14px; }
        .al-nav__link { font-size: 8px; letter-spacing: .08em; }
        .al-header__cta { padding-inline: 12px; }
        .al-service-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .al-footer__main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 820px) {
        :root { --al-section-space: 82px; }
        .al-header__inner { min-height: 76px; justify-content: space-between;}
        .al-menu-toggle { display: block; flex-shrink: 0; }
        .al-header__cta { display: none; }
        .al-nav {
            position: fixed; inset: 76px 0 auto 0; display: flex; flex-direction: column; align-items: stretch; gap: 0;
            max-height: calc(100svh - 76px); overflow-y: auto; padding: 12px var(--al-gutter) 26px;
            background: var(--al-ink); border-top: 1px solid rgba(255,255,255,.12);
            visibility: hidden; opacity: 0; transform: translateY(-10px); pointer-events: none;
        }
        .al-nav.is-open { visibility: visible; pointer-events: auto; }
        .al-nav__link { padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,.1); font-size: 10px; }
        .al-nav__link::after { display: none; }
        .al-nav__mobile-cta { display: block; margin-top: 18px; }
        .al-hero { min-height: auto; }
        .al-hero__grid { grid-template-columns: 1fr; gap: 44px; padding-block: 75px; }
        .al-hero__copy { max-width: 720px; }
        .al-hero__visual { max-width: 700px; width: 100%; }
        .al-hero__image { height: clamp(300px, 65vw, 480px); }
        .al-core-intro { grid-template-columns: 1fr; gap: 25px; }
        .al-core-why { grid-template-columns: 1fr; }
        .al-mission__grid { grid-template-columns: 1fr; }
        .al-mission__media-wrap { max-width: 640px; width: 100%; }
        .al-mission__video { height: 580px; aspect-ratio: 16 / 10; }
        .al-different-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .al-faq__grid { grid-template-columns: 1fr; }
        .al-faq__aside { position: static; }
        .al-faq__aside-copy { max-width: 620px; }
        }
        @media (max-width: 560px) {
        :root { --al-gutter: 20px; --al-section-space: 70px; }
        body { font-size: 15px; }
        .al-brand__mark { width: 37px; height: 37px; font-size: 22px; }
        .al-brand__name { font-size: 18px; }
        .al-brand__descriptor { font-size: 7px; }
        .al-nav-logo { width: clamp(130px, 46vw, 180px); }
        .al-hero__grid { padding-block: 62px; }
        .al-hero__title { font-size: clamp(3.35rem, 16vw, 5.2rem); }
        .al-hero__description { font-size: 13px; }
        .al-hero__actions { flex-direction: column; align-items: stretch; }
        .al-hero__actions .al-button { width: 100%; }
        .al-hero__meta { gap: 20px; }
        .al-hero__image-frame { min-height: 250px; padding: 8px; }
        .al-hero__image { height: 290px; }
        .al-section-head, .al-brands__top, .al-verticals__panel-head { align-items: center; flex-direction: column; }
        .al-brands__note { text-align: left; }
        .al-core-grid { grid-template-columns: 1fr; }
        .al-core-card { min-height: auto; }
        .al-core-why__list { grid-template-columns: 1fr; }
        .al-verticals__tabs { width: 100%; }
        .al-verticals__tab { flex: 1; min-width: 0; padding-inline: 12px; }
        .al-service-grid { grid-template-columns: 1fr; }
        .al-service-card__media { min-height: 210px; }
        .al-service-card__image { height: 220px; }
        .al-mission__media-wrap { min-height: 240px; padding: 8px; }
        .al-mission__video { aspect-ratio: 4 / 3; }
        .al-different-grid { grid-template-columns: 1fr; }
        .al-different-card__media { min-height: 200px; }
        .al-different-card__image { height: 200px; }
        .al-footer__main { grid-template-columns: 1fr; gap: 36px; }
        .al-footer__bottom { align-items: flex-start; flex-direction: column; }
        .al-footer__bottom-links { gap: 14px; }
        }
        @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }

        
/* =========================================================
   AST RALUXE — REGISTRATION DROPDOWN
========================================================= */

.al-nav-dropdown {
  position: relative;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

/* Trigger matches the existing navbar links. */
.al-nav-dropdown__trigger {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 10px 0;
  margin: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: #E7EBF0;
  font: 500 13px/1.4 var(--al-sans);
  letter-spacing: .11em;
  text-transform: uppercase;
  white-space: nowrap;
  cursor: pointer;
}

/* Existing nav underline effect. */
.al-nav-dropdown__trigger::after {
  content: "";
  position: absolute;
  left: 0;
  right: 100%;
  bottom: 2px;
  height: 1px;
  background: var(--al-gold);
  transition: right .25s ease;
}

.al-nav-dropdown__trigger:hover::after,
.al-nav-dropdown__trigger:focus-visible::after,
.al-nav-dropdown.is-open .al-nav-dropdown__trigger::after {
  right: 0;
}

.al-nav-dropdown__chevron {
  display: inline-block;
  color: var(--al-gold);
  font-size: 10px;
  line-height: 1;
  transition: transform .3s ease;
}

.al-nav-dropdown.is-open .al-nav-dropdown__chevron {
  transform: rotate(180deg);
}

/* Dropdown panel. */
.al-nav-dropdown__menu {
  position: absolute;
  top: 100%;
  left: 50%;
  z-index: 1000;
  width: 280px;
  margin-top: 10px;
  padding: 8px;

  background: var(--al-charcoal);
  border: 1px solid rgba(197, 168, 128, .4);
  border-radius: 4px;
  box-shadow: 0 18px 45px rgba(15, 23, 42, .28);

  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translate(-50%, 10px);

  transition:
    opacity .25s ease,
    transform .3s ease,
    visibility .25s ease;
}

/* Open state — toggled by JavaScript on click. */
.al-nav-dropdown.is-open .al-nav-dropdown__menu {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translate(-50%, 0);
}

/* Champagne accent line. */
.al-nav-dropdown__menu::before {
  content: "";
  display: block;
  height: 2px;
  margin: -8px 18px 8px;
  background: var(--al-champagne);
}

/* Both options are anchor tags. */
.al-nav-dropdown__option {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 14px 13px;
  border-radius: 2px;
  text-decoration: none;
  transition: background .25s ease, padding-left .25s ease;
}

.al-nav-dropdown__option + .al-nav-dropdown__option {
  border-top: 1px solid rgba(255, 255, 255, .1);
}

.al-nav-dropdown__option:hover,
.al-nav-dropdown__option:focus-visible {
  padding-left: 18px;
  background: rgba(197, 168, 128, .1);
  outline: none;
}

.al-nav-dropdown__option-title {
  color: var(--al-white);
  font: 600 11px/1.6 var(--al-sans);
  letter-spacing: .09em;
  text-transform: uppercase;
}

.al-nav-dropdown__option-description {
  color: #CBD5E1;
  font: 400 12px/1.6 var(--al-body);
}

.al-nav-dropdown__trigger:focus-visible {
  outline: 1px solid var(--al-champagne);
  outline-offset: 5px;
}

/* Match your existing mobile navbar breakpoint. */
@media (max-width: 820px) {
  .al-nav-dropdown {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
  }

  .al-nav-dropdown__trigger {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 15px 0;
    border-bottom: 1px solid rgba(255, 255, 255, .1);
    font-size: 10px;
    letter-spacing: .08em;
  }

  .al-nav-dropdown__trigger::after {
    display: none;
  }

  .al-nav-dropdown__menu {
    position: static;
    width: 100%;
    margin-top: 0;
    padding: 0 8px;
    border-radius: 2px;
    box-shadow: none;
    transform: translateY(8px);
  }

  .al-nav-dropdown.is-open .al-nav-dropdown__menu {
    transform: translateY(0);
  }

  .al-nav-dropdown__menu::before {
    margin-top: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .al-nav-dropdown__menu,
  .al-nav-dropdown__chevron,
  .al-nav-dropdown__option {
    transition: none;
  }
}


/* =======================================================
   ASTRALUXE — RESPONSIVE HEADER & SLIDE-IN NAVIGATION
   Desktop: Original navigation
   Tablet/Mobile: Hamburger + Logo + Call + Sidebar
======================================================= */


/* =======================================================
   01 — MOBILE CONTROLS HIDDEN ON DESKTOP
======================================================= */

.al-mobile-menu-btn,
.al-mobile-call-btn,
.al-menu-backdrop {
  display: none;
}


/* =======================================================
   02 — TABLET & MOBILE HEADER
======================================================= */

@media screen and (max-width: 1024px) {

  /* HEADER */

  .al-header {
    position: relative;
    z-index: 1103;
  }

  .al-header__inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1103;
  }


  /* HAMBURGER BUTTON */

  .al-mobile-menu-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;

    width: 42px;
    height: 42px;
    padding: 8px;

    flex-shrink: 0;

    border: 1px solid rgba(197, 168, 128, 0.45);
    border-radius: 50%;

    background: transparent;
    cursor: pointer;

    position: relative;
    z-index: 1103;
  }

  .al-mobile-menu-btn span {
    display: block;
    width: 19px;
    height: 2px;

    background: #C5A880;
    border-radius: 5px;

    transition:
      transform 0.3s ease,
      opacity 0.3s ease;
  }

  /* Hamburger transforms into X */

  .al-mobile-menu-btn.is-active span:nth-child(1) {
    transform: translateY(8px) rotate(45deg);
  }

  .al-mobile-menu-btn.is-active span:nth-child(2) {
    opacity: 0;
  }

  .al-mobile-menu-btn.is-active span:nth-child(3) {
    transform: translateY(-8px) rotate(-45deg);
  }


  /* LOGO */

  .al-brand {
    display: flex;
    align-items: center;
    justify-content: center;

    flex: 1;
    min-width: 0;
  }

  .al-nav-logo {
    display: block;

    width: auto;
    max-width: 190px;
    max-height: 55px;

    object-fit: contain;
  }


  /* CALL BUTTON */

  .al-mobile-call-btn {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 42px;
    height: 42px;

    flex-shrink: 0;

    border: 1px solid rgba(197, 168, 128, 0.45);
    border-radius: 50%;

    color: #C5A880;
    background: transparent;

    font-size: 16px;
    text-decoration: none;

    transition: all 0.3s ease;
  }

  .al-mobile-call-btn:hover {
    color: #1E293B;
    background: #C5A880;
    border-color: #C5A880;
  }


  /* =====================================================
     03 — PREMIUM SLIDE-IN NAVIGATION SIDEBAR
  ===================================================== */

  .al-nav {
    display: flex;

    position: fixed;
    top: 0;
    left: 0;

    width: min(360px, 86vw);
    height: 100vh;
    height: 100dvh;

    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;

    gap: 0;

    padding: 105px 28px 35px;

    background: #1E293B;

    border-right: 1px solid rgba(197, 168, 128, 0.35);

    box-shadow: 15px 0 50px rgba(0, 0, 0, 0.25);

    overflow-y: auto;
    overscroll-behavior: contain;

    z-index: 1102;

    /* Initially hidden outside the left edge */

    transform: translateX(-105%);
    visibility: hidden;
    pointer-events: none;

    transition:
      transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
      visibility 0.55s;
  }


  /* SIDEBAR OPEN STATE */

  .al-nav.is-open {
    transform: translateX(0);
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
  }


  /* =====================================================
     04 — NAVIGATION LINKS
  ===================================================== */

  .al-nav > .al-nav__link,
  .al-nav .al-nav-dropdown > .al-nav__link {

    display: flex;
    align-items: center;
    justify-content: space-between;

    width: 100%;

    padding: 19px 4px;

    color: #F8FAFC;

    font-family: "Montserrat", sans-serif;
    font-size: 13px;
    font-weight: 500;

    letter-spacing: 1.1px;
    text-transform: uppercase;

    text-align: left;
    text-decoration: none;

    background: transparent;

    border: none;
    border-bottom: 1px solid rgba(197, 168, 128, 0.19);

    cursor: pointer;

    transition:
      color 0.3s ease,
      padding-left 0.3s ease;
  }

  .al-nav .al-nav__link:hover {
    color: #C5A880;
    padding-left: 11px;
  }


  /* =====================================================
     05 — REGISTRATION DROPDOWN
  ===================================================== */

  .al-nav-dropdown {
    width: 100%;
  }

  .al-nav-dropdown__trigger {
    cursor: pointer;
  }

  .al-nav-dropdown__chevron {
    color: #C5A880;

    transition: transform 0.3s ease;
  }

  .al-nav-dropdown.is-open .al-nav-dropdown__chevron {
    transform: rotate(180deg);
  }


  /* Dropdown initially collapsed */

  .al-nav-dropdown__menu {
    display: flex;
    flex-direction: column;

    position: static;
    width: 100%;

    max-height: 0;
    overflow: hidden;

    padding: 0 0 0 13px;

    background: transparent;

    border: none;
    box-shadow: none;

    opacity: 0;
    visibility: hidden;

    transition:
      max-height 0.4s ease,
      opacity 0.3s ease,
      visibility 0.3s ease,
      padding 0.3s ease;
  }


  /* Dropdown expanded */

  .al-nav-dropdown.is-open .al-nav-dropdown__menu {
    max-height: 180px;

    padding-top: 8px;
    padding-bottom: 8px;

    opacity: 1;
    visibility: visible;
  }


  /* Dropdown options */

  .al-nav-dropdown__option {
    display: flex;
    flex-direction: column;
    gap: 6px;

    padding: 13px 12px;

    border-left: 1px solid rgba(197, 168, 128, 0.45);

    text-decoration: none;

    transition: background 0.3s ease;
  }

  .al-nav-dropdown__option:hover {
    background: rgba(197, 168, 128, 0.08);
  }

  .al-nav-dropdown__option-title {
    color: #C5A880;

    font-family: "Cormorant Garamond", serif;
    font-size: 19px;
    font-weight: 600;
  }

  .al-nav-dropdown__option-description {
    color: #CBD5E1;

    font-family: "Lora", serif;
    font-size: 11px;
    line-height: 1.5;
  }


  /* =====================================================
     06 — DARK BACKDROP
  ===================================================== */

  .al-menu-backdrop {
    display: block;

    position: fixed;
    inset: 0;

    width: 100%;
    height: 100vh;
    height: 100dvh;

    padding: 0;
    margin: 0;

    background: rgba(9, 15, 25, 0.65);

    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);

    border: none;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    z-index: 1101;

    transition:
      opacity 0.4s ease,
      visibility 0.4s ease;
  }

  .al-menu-backdrop.is-visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }


  /* PREVENT BACKGROUND SCROLLING */

  body.al-menu-open {
    overflow: hidden;
  }

}


/* =======================================================
   07 — SMALL MOBILE OPTIMISATION
======================================================= */

@media screen and (max-width: 480px) {

  }

}

  <script>

    document.addEventListener("DOMContentLoaded", function () {
    
        /* =========================================================
        AST RALUXE — REGISTRATION DROPDOWN CLICK HANDLER
        Works with static and dynamically inserted navigation.
        ========================================================= */

        (() => {
        // Prevent duplicate event listeners if the script is loaded twice.
        if (window.alRegistrationDropdownInitialized) return;
        window.alRegistrationDropdownInitialized = true;

        function closeDropdown(dropdown) {
            const trigger = dropdown.querySelector(
            ".al-nav-dropdown__trigger"
            );

            dropdown.classList.remove("is-open");

            if (trigger) {
            trigger.setAttribute("aria-expanded", "false");
            }
        }

        // Delegation allows clicks to work even when the header is loaded later.
        document.addEventListener("click", function (event) {
            const clickedTrigger = event.target.closest(
            ".al-nav-dropdown__trigger"
            );

            if (clickedTrigger) {
            event.preventDefault();

            const dropdown = clickedTrigger.closest(".al-nav-dropdown");
            if (!dropdown) return;

            const shouldOpen = !dropdown.classList.contains("is-open");

            // Close any other open registration dropdowns.
            document.querySelectorAll(".al-nav-dropdown.is-open").forEach(
                (openDropdown) => closeDropdown(openDropdown)
            );

            if (shouldOpen) {
                dropdown.classList.add("is-open");
                clickedTrigger.setAttribute("aria-expanded", "true");
            }

            return;
            }

            // Close the menu when clicking outside it.
            if (!event.target.closest(".al-nav-dropdown")) {
            document.querySelectorAll(".al-nav-dropdown.is-open").forEach(
                (dropdown) => closeDropdown(dropdown)
            );
            }
        });

        // Close on Escape.
        document.addEventListener("keydown", function (event) {
            if (event.key !== "Escape") return;

            document.querySelectorAll(".al-nav-dropdown.is-open").forEach(
            (dropdown) => {
                const trigger = dropdown.querySelector(
                ".al-nav-dropdown__trigger"
                );

                closeDropdown(dropdown);

                if (trigger) trigger.focus();
            }
            );
        });
        })();

    });

  </script>
